name: Render LOESS graph automatically efter each commit

on:
  push:
    branches: [ "main" ]
    paths:
      - 'carney government approval polls.csv'
      - 'carney government approval loess.R'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-plot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Graphics Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R packages
        run: |
          install.packages(c("ggplot2", "tidyverse", "svglite"))
        shell: Rscript {0}

      - name: Run R Script
        run: |
          source("carney government approval loess.R")
        shell: Rscript {0}

      - name: Commit and Push Updated SVG
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "carney government approval polls.svg"
          git diff-index --quiet HEAD || git commit -m "Auto-render updated SVG plot"
          git push
